<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="60%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="1600" height="380" fill="url(#sky)" />
  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.65">
    <ellipse cx="280" cy="95" rx="90" ry="26" />
    <ellipse cx="330" cy="85" rx="70" ry="30" />
    <ellipse cx="1250" cy="110" rx="110" ry="28" />
    <ellipse cx="1310" cy="95" rx="80" ry="32" />
  </g>
  <!-- University Building Wings -->
  <rect x="180" y="180" width="1240" height="190" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3" />
  <rect x="200" y="195" width="380" height="175" fill="#e2e8f0" />
  <rect x="1020" y="195" width="380" height="175" fill="#e2e8f0" />
  <!-- Red Brick Accents -->
  <rect x="180" y="170" width="1240" height="16" fill="#b91c1c" />
  <rect x="560" y="115" width="480" height="255" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" />
  <rect x="560" y="105" width="480" height="16" fill="#991b1b" />
  <!-- Central Dome / Pediment -->
  <polygon points="540,105 800,38 1060,105" fill="#f1f5f9" stroke="#94a3b8" stroke-width="3" />
  <circle cx="800" cy="78" r="18" fill="#1e3a8a" stroke="#ffffff" stroke-width="3" />
  <!-- Pillars -->
  <g fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2">
    <rect x="605" y="130" width="22" height="220" />
    <rect x="680" y="130" width="22" height="220" />
    <rect x="755" y="130" width="22" height="220" />
    <rect x="823" y="130" width="22" height="220" />
    <rect x="898" y="130" width="22" height="220" />
    <rect x="973" y="130" width="22" height="220" />
  </g>
  <!-- Windows Left Wing -->
  <g fill="#1e3a8a" opacity="0.75">
    <rect x="230" y="215" width="45" height="36" rx="3" />
    <rect x="300" y="215" width="45" height="36" rx="3" />
    <rect x="370" y="215" width="45" height="36" rx="3" />
    <rect x="440" y="215" width="45" height="36" rx="3" />
    <rect x="505" y="215" width="35" height="36" rx="3" />
    <rect x="230" y="275" width="45" height="36" rx="3" />
    <rect x="300" y="275" width="45" height="36" rx="3" />
    <rect x="370" y="275" width="45" height="36" rx="3" />
    <rect x="440" y="275" width="45" height="36" rx="3" />
    <rect x="505" y="275" width="35" height="36" rx="3" />
  </g>
  <!-- Windows Right Wing -->
  <g fill="#1e3a8a" opacity="0.75">
    <rect x="1060" y="215" width="35" height="36" rx="3" />
    <rect x="1115" y="215" width="45" height="36" rx="3" />
    <rect x="1185" y="215" width="45" height="36" rx="3" />
    <rect x="1255" y="215" width="45" height="36" rx="3" />
    <rect x="1325" y="215" width="45" height="36" rx="3" />
    <rect x="1060" y="275" width="35" height="36" rx="3" />
    <rect x="1115" y="275" width="45" height="36" rx="3" />
    <rect x="1185" y="275" width="45" height="36" rx="3" />
    <rect x="1255" y="275" width="45" height="36" rx="3" />
    <rect x="1325" y="275" width="45" height="36" rx="3" />
  </g>
  <!-- Central Entrance Arch -->
  <rect x="765" y="270" width="70" height="100" rx="35" fill="#0f172a" />
  <!-- Trees & Lawn -->
  <rect x="0" y="370" width="1600" height="130" fill="url(#lawn)" />
  <polygon points="730,370 870,370 960,500 640,500" fill="#cbd5e1" />
  <g fill="#166534">
    <circle cx="140" cy="330" r="55" />
    <circle cx="195" cy="340" r="45" />
    <circle cx="520" cy="345" r="40" />
    <circle cx="1080" cy="345" r="40" />
    <circle cx="1410" cy="340" r="45" />
    <circle cx="1465" cy="330" r="55" />
  </g>
</svg>
